name: CFB Season Progression (2026)

# Automates the previously-manual two-command pipeline
# (fetch_results.py + backtest.py) for the 2026 CFB regular season.
#
# Scope, by explicit user decision:
#   - Week 1 was populated by hand this session (2026-09-08), not by this
#     workflow - CFBD had already settled its results, and there's no
#     "previous week" for a Sunday-after trigger to have fired from.
#   - Weeks 2-13 populate Sunday 6 AM ET, the morning after each week's
#     Saturday slate finishes. Verified safe against real CFBD data for
#     this season: no week 2-13 game falls on a Sunday or Monday (see
#     the schedule audit from 2026-09-08 - MACtion/C-USA midweek games
#     in weeks 6-13 land Tue/Wed, well before the following Sunday). Week
#     2's own trigger (2026-09-13) was added 2026-09-12, a day after the
#     rest of this workflow shipped - it was originally left manual only
#     because week 2 hadn't been played yet as of that build, not for any
#     date-safety reason (the schedule audit above already covered week
#     2 and found it clean).
#   - Week 14 (conference championship weekend) populates Monday 6 AM ET
#     instead, one day later than the rest - real CFBD data for
#     2022-2025 shows the Big Ten and ACC championship games are played
#     Sunday (an ESPN/ABC broadcast-window pattern, 4 years running),
#     so a Sunday-morning run would fire before those games are final.
#   - Bowl season / CFP is NOT covered here - deliberately deferred to a
#     separate workflow once that structure is worked out.
#
# Cron times are UTC and hardcode the ET->UTC offset for each date's DST
# state (EDT = UTC-4 through 2026-11-01; EST = UTC-5 after). Because this
# whole schedule is specific to the 2026 calendar, this workflow is not
# meant to be reused as-is for a future season - a new season's dates
# (and possibly its DST cutover) need to be re-derived from that year's
# real CFBD /calendar output, not copied forward.
on:
  schedule:
    - cron: "0 10 13 9 *"  # Week 2  - Sun 2026-09-13, 6:00 AM EDT
    - cron: "0 10 20 9 *"  # Week 3  - Sun 2026-09-20, 6:00 AM EDT
    - cron: "0 10 27 9 *"  # Week 4  - Sun 2026-09-27, 6:00 AM EDT
    - cron: "0 10 4 10 *"  # Week 5  - Sun 2026-10-04, 6:00 AM EDT
    - cron: "0 10 11 10 *" # Week 6  - Sun 2026-10-11, 6:00 AM EDT
    - cron: "0 10 18 10 *" # Week 7  - Sun 2026-10-18, 6:00 AM EDT
    - cron: "0 10 25 10 *" # Week 8  - Sun 2026-10-25, 6:00 AM EDT
    - cron: "0 11 1 11 *"  # Week 9  - Sun 2026-11-01, 6:00 AM EST (DST ends 2 AM this day)
    - cron: "0 11 8 11 *"  # Week 10 - Sun 2026-11-08, 6:00 AM EST
    - cron: "0 11 15 11 *" # Week 11 - Sun 2026-11-15, 6:00 AM EST
    - cron: "0 11 22 11 *" # Week 12 - Sun 2026-11-22, 6:00 AM EST
    - cron: "0 11 29 11 *" # Week 13 - Sun 2026-11-29, 6:00 AM EST
    - cron: "0 11 7 12 *"  # Week 14 (conf champ) - Mon 2026-12-07, 6:00 AM EST
  workflow_dispatch:
    inputs:
      week:
        description: "Week number to populate (manual override/backfill; leave blank on a normal scheduled run)"
        required: false

jobs:
  populate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Determine which week fired
        id: week
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            WEEK="${{ inputs.week }}"
          else
            case "$(date -u +%m-%d)" in
              09-13) WEEK=2 ;;
              09-20) WEEK=3 ;;
              09-27) WEEK=4 ;;
              10-04) WEEK=5 ;;
              10-11) WEEK=6 ;;
              10-18) WEEK=7 ;;
              10-25) WEEK=8 ;;
              11-01) WEEK=9 ;;
              11-08) WEEK=10 ;;
              11-15) WEEK=11 ;;
              11-22) WEEK=12 ;;
              11-29) WEEK=13 ;;
              12-07) WEEK=14 ;;
              *)
                echo "No week mapped to today's date ($(date -u +%Y-%m-%d)) - skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"

      - name: Fetch week results, run backtest, and refresh schedule previews
        if: steps.week.outputs.skip != 'true'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          WEEK="${{ steps.week.outputs.week }}"
          python sports/cfb/fetch_results.py --season 2026 --week "$WEEK"
          python scripts/backtest.py --sport cfb --season 2026 --weeks "$WEEK"
          # Re-fetch THIS week's own matchup file to bake in final scores
          # now that the games are over (was seeded as a schedule-only
          # preview by last week's run - see the next step below).
          python sports/cfb/fetch_week_matchups.py --season 2026 --week "$WEEK"
          # Seed NEXT week's schedule preview, so the site has something
          # concrete to show for "what's coming" the moment this week
          # solidifies, instead of stale data from this week lingering.
          python sports/cfb/fetch_week_matchups.py --season 2026 --week "$((WEEK + 1))" || true

      - name: Commit updated season data
        if: steps.week.outputs.skip != 'true'
        run: |
          WEEK="${{ steps.week.outputs.week }}"
          WEEK_PADDED=$(printf "%02d" "$WEEK")
          NEXT_WEEK_PADDED=$(printf "%02d" "$((WEEK + 1))")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/cfb/seasons/2026/raw/week_${WEEK_PADDED}_games.json" \
                  "data/cfb/seasons/2026/raw/week_${WEEK_PADDED}_matchups.json" \
                  "data/cfb/seasons/2026/raw/week_${NEXT_WEEK_PADDED}_matchups.json" \
                  "data/cfb/seasons/2026/season_history.json"
          git commit -m "Auto-populate CFB 2026 week ${WEEK}" || echo "Nothing to commit"
          git push
