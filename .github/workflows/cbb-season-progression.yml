name: CBB Standings (every 15 min)

# Basketball standings move GAME BY GAME (user's call 2026-11-15; see
# sports/cbb/build_season.py and PROJECT_BIBLE.md §14). Every ~15 minutes:
#   1. espn_days.py refreshes ESPN day files (yesterday, today, next 3
#      days every run; the whole 4-week look-ahead on the first run of
#      every 6th hour, or whenever a day file is missing);
#   2. build_season.py replays every final since the opener through the
#      swap engine, in tip-off order, and rewrites season_history.json +
#      schedule.json only if something real changed;
#   3. commit + push only when a file changed (no no-op commits).
# Nothing is per-week or per-date here; a new season only needs its
# WEEK1_MONDAY / SEASON_FIRST_DAY pinned in sports/cbb/config.py. Runs
# outside the season (no pin for the year) exit cleanly.
#
# GitHub starts scheduled runs late under load (often 5-15 min), so a
# swap typically lands on the site 15-30 min after the final buzzer; the
# basketball live Worker shows the final + a provisional upset card
# sooner. Pages' soft limit is 10 builds/hour; this commits at most 4.
#
# The CBBD preseason poll (fetch_results.py) is fetched once if missing.

on:
  schedule:
    - cron: "*/15 * * 11,12,1,2,3,4 *"
  workflow_dispatch:
    inputs:
      full:
        description: "Refresh the whole look-ahead horizon too"
        type: boolean
        default: false

concurrency:
  group: cbb-season-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Determine season
        id: season
        run: |
          # Stored under the year the season STARTS (2026 = 2026-27).
          YEAR=$(TZ=America/New_York date +%Y); MONTH=$(TZ=America/New_York date +%-m)
          if [ "$MONTH" -lt 6 ]; then YEAR=$((YEAR - 1)); fi
          if ! python -c "import sys; sys.path.insert(0,'sports/cbb'); import config; sys.exit(0 if $YEAR in config.SEASON_FIRST_DAY else 1)"; then
            echo "No SEASON_FIRST_DAY pinned for CBB $YEAR in sports/cbb/config.py - skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "season=$YEAR" >> "$GITHUB_OUTPUT"
          # Full horizon refresh on the first run of every 6th UTC hour.
          if [ "${{ inputs.full }}" = "true" ] || { [ $(( $(date -u +%-H) % 6 )) -eq 0 ] && [ "$(date -u +%-M)" -lt 15 ]; }; then
            echo "full=--full" >> "$GITHUB_OUTPUT"
          fi

      - name: Preseason poll (once)
        if: steps.season.outputs.skip != 'true'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          SEASON="${{ steps.season.outputs.season }}"
          if [ ! -f "data/cbb/seasons/$SEASON/preseason_poll.json" ]; then
            python sports/cbb/fetch_results.py --season "$SEASON" --preseason-poll
          fi

      - name: Refresh ESPN day files and rebuild standings
        if: steps.season.outputs.skip != 'true'
        run: |
          SEASON="${{ steps.season.outputs.season }}"
          python sports/cbb/espn_days.py --season "$SEASON" ${{ steps.season.outputs.full }}
          python sports/cbb/build_season.py --season "$SEASON" | tee build.log

      - name: Commit if anything changed
        if: steps.season.outputs.skip != 'true'
        run: |
          SEASON="${{ steps.season.outputs.season }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/cbb/seasons/$SEASON"
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          if git diff --cached --name-only | grep -q season_history.json; then
            MSG="CBB $SEASON standings update"
          else
            MSG="CBB $SEASON scores/schedule refresh"
          fi
          git commit -q -m "$MSG"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          echo "::error::push failed after 3 attempts"
          exit 1

      - uses: actions/setup-node@v4
        if: always() && steps.season.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Validate team names in the published data
        if: always() && steps.season.outputs.skip != 'true'
        run: python tests/test_team_registry.py
