name = "powerswap-live-scores"
main = "worker.js"
compatibility_date = "2026-09-01"

kv_namespaces = [
  { binding = "LIVE_KV", id = "55f3c6dc817145c58d216e9d0364e3cf" }
]

# Cron schedule lives here deliberately, not in the Cloudflare dashboard:
# `wrangler deploy` treats this [triggers] block as the source of truth for
# the Worker's cron triggers on every deploy, so keeping the schedule here
# (instead of setting it by hand in the dashboard) is what keeps it from
# silently drifting or getting cleared across deploys.
#
# UPDATED 2026-09-19 (real BBS cap confirmed 500/day, not the 2,000/day
# its own docs claimed for a GitHub-linked account - see PROJECT_BIBLE.md
# §6 and admin/BUILD_LOG.md's 2026-09-19 entry for the full incident,
# including a same-day ESPN-as-primary attempt that was reverted after a
# real deterministic 403 from Cloudflare's network - see worker.js's
# REDUNDANCY BUILD comment). Every cron tick does exactly ONE flat poll,
# no in-Worker loop, no kickoff-time-driven polling FREQUENCY - BBS's
# /v1/stored/matches returns the whole day's slate in one call regardless
# of game count, so request volume is purely a function of ticks/day.
#
# Per-tick cost is 1-2 requests, not a flat 2 (decoupled 2026-09-12, see
# worker.js's needsYesterdayQuery() / TODAY vs. YESTERDAY DECOUPLED
# comment): "today" always fires, "yesterday" only fires while a
# not-yet-finished game from yesterday's UTC date is still in the cache,
# self-limiting instead of a flat every-tick cost.
#
# Sized to the MOST FREQUENT interval that still fits the real 500/day cap
# under the SAME worst-case method this project already used for the old
# 2,000/day cap (both dates queried every tick, the whole day):
#   "*/6 * * * *" = 240 ticks/day.
#   Floor (today-only, the common case): 240 requests/day (48% of 500).
#   Worst case (both dates every tick, e.g. a stuck yesterday game all
#   day): 480 requests/day (96% of 500, 20-request/~4% headroom).
# That headroom is intentionally thin - the user's explicit instruction
# was the most frequent cadence the real cap allows, not the old design's
# ~28%-headroom convention (which existed to leave room for the /v1/matches
# secondary to absorb overflow during an outage - less relevant now that
# BBS itself is a single account across both its endpoints, not two
# independent quotas). The one compound scenario this doesn't fully cover:
# a stuck yesterday game AND the /v1/matches secondary ALSO getting called
# every tick (a full primary outage) would exceed 500/day - an accepted,
# understood risk for a failure mode that's already degrading service
# anyway, not silently ignored. Revisit downward if that combination is
# ever actually observed hitting a real 429.
[triggers]
crons = ["*/6 * * * *"]
