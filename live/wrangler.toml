name = "powerswap-live-scores"
main = "worker.js"
compatibility_date = "2026-09-01"

kv_namespaces = [
  { binding = "LIVE_KV", id = "55f3c6dc817145c58d216e9d0364e3cf" }
]

# Cron schedule lives here deliberately, not in the Cloudflare dashboard:
# `wrangler deploy` treats this [triggers] block as the source of truth for
# the Worker's cron triggers on every deploy, so keeping the schedule here
# (instead of setting it by hand in the dashboard) is what keeps it from
# silently drifting or getting cleared across deploys.
#
# Every 5 minutes, all day. The Worker itself narrows this down further:
# it skips the BBS call entirely when there are no ranked teams yet, and
# only sub-polls more tightly (see SUBPOLL_* in worker.js) inside an
# actual game window. Cloudflare Cron Triggers can't fire more than once a
# minute, which is why "every 5 min + in-worker sub-polling" is used
# instead of trying to express "every 15s" directly here.
#
# Second entry (2026-09-05, STOPGAP - see worker.js's STOPGAP comment):
# "0 7 * * *" = 07:00 UTC = 3 AM EDT, dispatched to
# revertToPrimaryBbsKey() via worker.js's scheduled() handler (branches on
# event.cron). Reverts the BBS_API_KEY_BACKUP stopgap back to the primary
# key with no human action needed. Recurring daily rather than one-shot -
# Cloudflare Cron Triggers don't support one-shot - but the revert is
# idempotent (no-op if already on primary), so that's harmless.
[triggers]
crons = ["*/5 * * * *", "0 7 * * *"]
