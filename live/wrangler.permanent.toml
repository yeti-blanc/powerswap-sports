name = "powerswap-live-scores"
main = "worker.js"
compatibility_date = "2026-09-01"

kv_namespaces = [
  { binding = "LIVE_KV", id = "55f3c6dc817145c58d216e9d0364e3cf" }
]

# Cron schedule lives here deliberately, not in the Cloudflare dashboard:
# `wrangler deploy` treats this [triggers] block as the source of truth for
# the Worker's cron triggers on every deploy, so keeping the schedule here
# (instead of setting it by hand in the dashboard) is what keeps it from
# silently drifting or getting cleared across deploys.
#
# PERMANENT VERSION (deployed 2026-09-06 ~3 AM ET, swapped in from the
# 2026-09-05 same-day stopgap - see admin/BUILD_LOG.md for the full
# history): every cron tick does exactly ONE flat poll, no in-Worker
# loop, no kickoff-time judgment - BBS's /v1/stored/matches returns the
# whole day's slate in one call regardless of game count, so request
# volume is purely ticks/day x 2, provably fixed:
#   "*/2 * * * *" = 720 ticks/day x 2 = 1,440 requests/day, under the
#   primary BBS_API_KEY account's 2,000/day cap (28% headroom).
[triggers]
crons = ["*/2 * * * *"]
